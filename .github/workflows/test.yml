# Unit tests plus the dictionary morphology parity check (PEG vs Earley),
# for each engine feature combination.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: peg only (default features)
            features: ""
          - name: earley only
            features: "--no-default-features --features earley"
          - name: all features (incl. tests/dictionary_corpus.rs parity)
            features: "--all-features"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings
      - name: tests
        run: cargo test --release ${{ matrix.features }}
      - name: docs
        run: cargo doc --no-deps ${{ matrix.features }}
        env:
          RUSTDOCFLAGS: -D warnings
