[package]
name = "camxes-rs"
version = "2.0.0"
edition = "2021"
description = "PEG parser generator with Lojban grammars, plus an optional Earley engine and CLL-dialect Lojban morphology"
license = "MIT"
repository = "https://github.com/lojban/camxes-rs"
keywords = ["peg", "parser", "earley", "lojban", "morphology"]
categories = ["parsing", "parser-implementations"]
readme = "README.md"
# Large test fixtures stay in the repository but are not shipped to crates.io.
exclude = [
    "/tests/data/",
    "/tests/dictionary_corpus.rs",
    "/examples/morphology_corpus.rs",
    "/scripts/",
    "/.github/",
    "/.cargo/",
]

[package.metadata.docs.rs]
all-features = true

[dependencies]
log = "0.4.27"
rustc-hash = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
# Enable `Engine::Earley` and the vendored tergenzalvi CLL morphology (`cll`).
earley = []

[dev-dependencies]
criterion = "0.5"
env_logger = "0.11.8"
flate2 = "1"

[[example]]
name = "cmaxes-test"
path = "src/examples/cmaxes-test.rs"

[[example]]
name = "morphology_corpus"
path = "examples/morphology_corpus.rs"
required-features = ["earley"]

[[bench]]
name = "parser"
harness = false

[profile.dev]
opt-level = 1
codegen-units = 16

[profile.release]
lto = true           # Enable Link Time Optimization
codegen-units = 1    # Maximize optimization opportunities (slower compile time)
strip = true         # Strip symbols from the binary
opt-level = 3        # Optimize for speed (default for release)
panic = 'abort'      # Abort on panic for potentially smaller/faster code

[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

